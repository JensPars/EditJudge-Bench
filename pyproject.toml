[project]
name = "editjudge-bench"
version = "1.0.0"
description = "EditJudge-Bench: auditing VLM image-edit judges with synthetic ground truth"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "huggingface_hub>=0.30",
    "matplotlib>=3.8",
    "numpy>=2.0",
    "pandas>=2.2",
    "pillow>=10",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "scipy>=1.12",
    "tqdm>=4.66",
]

[project.optional-dependencies]
vllm = ["vllm>=0.20", "transformers>=5.0"]                 # open-weight judges
api = ["openai>=2.0", "anthropic>=0.90", "google-genai>=1.0"]
reranker = ["torch", "transformers>=5.0", "qwen-vl-utils"]
editscore = ["torch", "transformers>=5.0", "peft", "json-repair", "qwen-vl-utils"]
bridge = ["datasets>=4,<5"]                                # GenAI-Bench / EditReward-Bench images
dev = ["pytest>=8"]

[project.scripts]
editjudge = "editjudge.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["editjudge*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
